<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>My Profile - AI Resume Analyzer</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: white;
            min-height: 100vh;
        }

        /* NAVBAR */

        .navbar {
            background: #111827;
            padding: 18px 6%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #334155;
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
        }

        .nav-links {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .nav-links a {
            color: #cbd5e1;
            text-decoration: none;
            padding: 9px 13px;
            border-radius: 7px;
        }

        .nav-links a:hover {
            background: #334155;
            color: white;
        }

        /* MAIN */

        .container {
            width: 90%;
            max-width: 1000px;
            margin: 50px auto;
        }

        .title {
            text-align: center;
            margin-bottom: 30px;
        }

        .title h1 {
            font-size: 38px;
            margin-bottom: 8px;
        }

        .title p {
            color: #94a3b8;
        }

        /* PROFILE CARD */

        .profile-card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 20px;
            padding: 40px;
            max-width: 650px;
            margin: auto;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
        }

        /* PROFILE IMAGE */

        .profile-image {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
            border: 5px solid #6366f1;
            margin-bottom: 20px;
        }

        .default-avatar {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: #6366f1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 65px;
            margin: 0 auto 20px;
            border: 5px solid #818cf8;
        }

        .profile-card h2 {
            font-size: 28px;
            margin-bottom: 8px;
        }

        .email {
            color: #94a3b8;
            margin-bottom: 30px;
        }

        /* UPLOAD */

        .upload-section {
            background: #111827;
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 25px;
        }

        .upload-section h3 {
            margin-bottom: 15px;
        }

        input[type="file"] {
            width: 100%;
            padding: 12px;
            background: #1e293b;
            color: #cbd5e1;
            border: 1px solid #475569;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        .upload-btn {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #6366f1;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .upload-btn:hover {
            background: #4f46e5;
        }

        /* BUTTONS */

        .actions {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .action-btn {
            text-decoration: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-weight: bold;
        }

        .password {
            background: #334155;
            color: white;
        }

        .dashboard {
            background: #22c55e;
            color: white;
        }

        .password:hover {
            background: #475569;
        }

        .dashboard:hover {
            background: #16a34a;
        }

        /* MOBILE */

        @media (max-width: 700px) {

            .navbar {
                flex-direction: column;
                gap: 15px;
            }

            .nav-links {
                justify-content: center;
            }

            .title h1 {
                font-size: 30px;
            }

            .profile-card {
                padding: 25px;
            }

        }

    </style>

</head>

<body>

    <!-- NAVBAR -->

    <div class="navbar">

        <div class="logo">
            🤖 AI Resume Analyzer
        </div>

        <div class="nav-links">

            <a href="/dashboard">
                📊 Dashboard
            </a>

            <a href="/upload">
                📄 Analyze
            </a>

            <a href="/history">
                📋 History
            </a>

            <a href="/profile">
                👤 Profile
            </a>

            <a href="/logout">
                🚪 Logout
            </a>

        </div>

    </div>


    <!-- MAIN -->

    <div class="container">

        <div class="title">

            <h1>👤 My Profile</h1>

            <p>
                Manage your account and profile picture
            </p>

        </div>


        <!-- PROFILE CARD -->

        <div class="profile-card">

            <!-- PROFILE IMAGE -->

            {% if user.profile_pic %}

                <img
                    src="{{ url_for('profile_picture', filename=user.profile_pic) }}"
                    class="profile-image"
                    alt="Profile Picture"
                >

            {% else %}

                <div class="default-avatar">
                    👤
                </div>

            {% endif %}


            <h2>
                {{ user.name }}
            </h2>

            <div class="email">
                {{ user.email }}
            </div>


            <!-- CHANGE PHOTO -->

            <div class="upload-section">

                <h3>
                    📸 Change Profile Picture
                </h3>

                <form
                    action="/profile"
                    method="POST"
                    enctype="multipart/form-data"
                >

                    <input
                        type="hidden"
                        name="csrf_token"
                        value="{{ csrf_token() }}"
                    >

                    <input
                        type="file"
                        name="profile_pic"
                        accept=".jpg,.jpeg,.png,.webp"
                        required
                    >

                    <button
                        type="submit"
                        class="upload-btn"
                    >
                        📤 Upload New Picture
                    </button>

                </form>

            </div>


            <!-- ACTION BUTTONS -->

            <div class="actions">

                <a
                    href="/change-password"
                    class="action-btn password"
                >
                    🔐 Change Password
                </a>

                <a
                    href="/dashboard"
                    class="action-btn dashboard"
                >
                    📊 Go to Dashboard
                </a>

            </div>

        </div>

    </div>

</body>

</html>
