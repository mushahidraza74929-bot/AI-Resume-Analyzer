<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Password Changed | AI Resume Analyzer</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {

            font-family: Arial, Helvetica, sans-serif;

            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            color: white;

            background:
                radial-gradient(
                    circle at 10% 10%,
                    rgba(91,105,255,0.30),
                    transparent 35%
                ),

                radial-gradient(
                    circle at 90% 90%,
                    rgba(145,65,220,0.28),
                    transparent 35%
                ),

                linear-gradient(
                    135deg,
                    #070a17,
                    #0d1022 50%,
                    #080a16
                );
        }


        .success-card {

            width: 90%;
            max-width: 520px;

            padding: 45px 35px;

            text-align: center;

            border-radius: 25px;

            background:
                rgba(255,255,255,0.065);

            border:
                1px solid
                rgba(255,255,255,0.10);

            box-shadow:
                0 25px 80px
                rgba(0,0,0,0.40);

            backdrop-filter: blur(20px);

            animation: fadeIn 0.6s ease;
        }


        .success-icon {

            width: 90px;
            height: 90px;

            margin: 0 auto 25px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;

            font-size: 48px;

            color: #ffffff;

            background:
                linear-gradient(
                    135deg,
                    #22c55e,
                    #16a34a
                );

            box-shadow:
                0 0 35px
                rgba(34,197,94,0.30);
        }


        .success-card h1 {

            font-size: 30px;

            margin-bottom: 12px;
        }


        .success-card p {

            color: #9da7bf;

            font-size: 14px;

            line-height: 1.7;

            margin-bottom: 30px;
        }


        .success-message {

            padding: 13px;

            margin-bottom: 28px;

            border-radius: 12px;

            color: #9ee6b7;

            background:
                rgba(34,197,94,0.07);

            border:
                1px solid
                rgba(34,197,94,0.15);

            font-size: 11px;
        }


        .profile-btn {

            display: inline-block;

            padding: 13px 28px;

            border-radius: 11px;

            color: white;

            text-decoration: none;

            font-size: 12px;

            font-weight: 700;

            background:
                linear-gradient(
                    135deg,
                    #596aff,
                    #8748dc
                );

            box-shadow:
                0 10px 30px
                rgba(89,106,255,0.25);

            transition: 0.25s;
        }


        .profile-btn:hover {

            transform:
                translateY(-2px);

            box-shadow:
                0 15px 35px
                rgba(89,106,255,0.35);
        }


        .footer {

            margin-top: 28px;

            color: #505a72;

            font-size: 9px;
        }


        @keyframes fadeIn {

            from {

                opacity: 0;

                transform:
                    translateY(20px)
                    scale(0.98);
            }

            to {

                opacity: 1;

                transform:
                    translateY(0)
                    scale(1);
            }
        }


        @media (max-width: 600px) {

            .success-card {

                padding: 35px 22px;
            }

            .success-icon {

                width: 75px;
                height: 75px;

                font-size: 40px;
            }

            .success-card h1 {

                font-size: 24px;
            }

            .success-card p {

                font-size: 13px;
            }
        }

    </style>

</head>


<body>


    <div class="success-card">


        <div class="success-icon">
            ✓
        </div>


        <h1>
            Password Changed Successfully!
        </h1>


        <p>

            Your password has been updated successfully.
            Your account is now protected with your new password.

        </p>


        <div class="success-message">

            🔐 Your password has been securely updated.

        </div>


        <a
            href="/profile"
            class="profile-btn"
        >

            Go to Profile →

        </a>


        <div class="footer">

            AI Resume Analyzer • Account Security

        </div>


    </div>


</body>

</html>
