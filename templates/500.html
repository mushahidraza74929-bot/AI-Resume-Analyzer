<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        Server Error - AI Resume Analyzer
    </title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            font-family: Arial, sans-serif;

            background: #0f172a;

            color: white;

            text-align: center;
        }

        .error-box {

            width: 90%;

            max-width: 550px;

            padding: 45px 30px;

            border-radius: 20px;

            background: #1e293b;

            box-shadow:
                0 15px 40px
                rgba(0, 0, 0, 0.4);
        }

        .error-code {

            font-size: 90px;

            font-weight: bold;

            margin-bottom: 10px;
        }

        h1 {

            font-size: 30px;

            margin-bottom: 15px;
        }

        p {

            color: #cbd5e1;

            margin-bottom: 30px;

            line-height: 1.6;
        }

        .button {

            display: inline-block;

            padding: 12px 25px;

            border-radius: 10px;

            background: #6366f1;

            color: white;

            text-decoration: none;

            font-weight: bold;
        }

        .button:hover {

            background: #4f46e5;
        }

    </style>

</head>

<body>

    <div class="error-box">

        <div class="error-code">
            500
        </div>

        <h1>
            Internal Server Error
        </h1>

        <p>
            Something went wrong on our server.
            Please try again later.
        </p>

        <a href="/" class="button">
            Go to Home
        </a>

    </div>

</body>

</html>
