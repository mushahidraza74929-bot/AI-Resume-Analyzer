<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Registration Successful | AI Resume Analyzer</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {

            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            color: white;

            background:
                radial-gradient(
                    circle at 10% 10%,
                    rgba(91,105,255,0.30),
                    transparent 35%
                ),

                radial-gradient(
                    circle at 90% 90%,
                    rgba(145,65,220,0.28),
                    transparent 35%
                ),

                linear-gradient(
                    135deg,
                    #070a17,
                    #0d1022 50%,
                    #080a16
                );

            padding: 25px;
        }


        /* =========================
           SUCCESS CARD
        ========================= */

        .success-card {

            width: 100%;
            max-width: 500px;

            padding: 45px 35px;

            text-align: center;

            border-radius: 25px;

            background:
                rgba(255,255,255,0.065);

            border:
                1px solid
                rgba(255,255,255,0.10);

            box-shadow:
                0 30px 80px
                rgba(0,0,0,0.40);

            backdrop-filter:
                blur(20px);

            animation:
                fadeIn 0.7s ease;
        }


        /* =========================
           ROBOT ICON
        ========================= */

        .logo-icon {

            width: 52px;
            height: 52px;

            margin: 0 auto 20px;

            display: flex;

            align-items: center;
            justify-content: center;

            border-radius: 15px;

            font-size: 25px;

            background:
                linear-gradient(
                    135deg,
                    #6675ff,
                    #9148df
                );

            box-shadow:
                0 10px 30px
                rgba(102,117,255,0.25);
        }


        /* =========================
           SUCCESS ICON
        ========================= */

        .success-icon {

            width: 92px;
            height: 92px;

            margin: 0 auto 25px;

            display: flex;

            align-items: center;
            justify-content: center;

            border-radius: 50%;

            font-size: 48px;

            background:
                linear-gradient(
                    135deg,
                    #22c55e,
                    #16a34a
                );

            box-shadow:
                0 0 40px
                rgba(34,197,94,0.30);

            animation:
                successPop 0.6s ease;
        }


        /* =========================
           TEXT
        ========================= */

        h1 {

            font-size: 30px;

            margin-bottom: 12px;
        }


        .subtitle {

            color: #9da7bf;

            font-size: 14px;

            line-height: 1.7;

            margin-bottom: 25px;
        }


        /* =========================
           ACCOUNT CREATED MESSAGE
        ========================= */

        .account-box {

            padding: 14px;

            margin-bottom: 28px;

            border-radius: 12px;

            color: #9ee6b7;

            background:
                rgba(34,197,94,0.07);

            border:
                1px solid
                rgba(34,197,94,0.15);

            font-size: 11px;

            line-height: 1.6;
        }


        /* =========================
           LOGIN BUTTON
        ========================= */

        .login-btn {

            display: inline-flex;

            align-items: center;
            justify-content: center;

            padding: 14px 30px;

            border-radius: 12px;

            color: white;

            text-decoration: none;

            font-size: 12px;

            font-weight: 700;

            background:
                linear-gradient(
                    135deg,
                    #596aff,
                    #8748dc
                );

            box-shadow:
                0 12px 32px
                rgba(89,106,255,0.25);

            transition: 0.3s;
        }


        .login-btn:hover {

            transform:
                translateY(-3px);

            box-shadow:
                0 17px 38px
                rgba(89,106,255,0.38);
        }


        /* =========================
           FOOTER
        ========================= */

        .footer {

            margin-top: 28px;

            color: #505a72;

            font-size: 9px;
        }


        /* =========================
           ANIMATIONS
        ========================= */

        @keyframes fadeIn {

            from {

                opacity: 0;

                transform:
                    translateY(25px)
                    scale(0.97);
            }

            to {

                opacity: 1;

                transform:
                    translateY(0)
                    scale(1);
            }
        }


        @keyframes successPop {

            0% {

                transform:
                    scale(0.5);

                opacity: 0;
            }

            70% {

                transform:
                    scale(1.08);
            }

            100% {

                transform:
                    scale(1);

                opacity: 1;
            }
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            body {

                padding: 18px;
            }

            .success-card {

                padding:
                    35px 22px;

                border-radius: 20px;
            }

            .success-icon {

                width: 78px;
                height: 78px;

                font-size: 40px;
            }

            h1 {

                font-size: 24px;
            }

            .subtitle {

                font-size: 13px;
            }

            .login-btn {

                width: 100%;
            }
        }

    </style>

</head>


<body>


    <div class="success-card">


        <!-- AI LOGO -->

        <div class="logo-icon">

            🤖

        </div>


        <!-- SUCCESS ICON -->

        <div class="success-icon">

            ✓

        </div>


        <!-- TITLE -->

        <h1>

            Registration Successful!

        </h1>


        <p class="subtitle">

            Welcome to AI Resume Analyzer! 🎉

            <br>

            Your account has been created successfully.

        </p>


        <!-- MESSAGE -->

        <div class="account-box">

            ✅ Your account is ready.
            You can now log in and start analyzing
            your resume.

        </div>


        <!-- LOGIN -->

        <a
            href="/login"
            class="login-btn"
        >

            🔐 Go to Login →

        </a>


        <!-- FOOTER -->

        <div class="footer">

            AI Resume Analyzer
            •
            Smart Resume Analysis Platform

        </div>


    </div>


</body>

</html>
